<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Compras">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Compras Parceladas</title>
<style>
  :root{
    --bg:#f2f2f7;
    --card:#ffffff;
    --text:#1c1c1e;
    --muted:#8e8e93;
    --border:#e5e5ea;
    --primary:#0a84ff;
    --primary-dark:#0066cc;
    --ok:#34c759;
    --ok-bg:#e8f9ee;
    --warn:#ff9500;
    --warn-bg:#fff4e5;
    --danger:#ff3b30;
    --danger-bg:#ffecea;
    --nav-h:64px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{overscroll-behavior-y:contain}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
    background:var(--bg);color:var(--text);
    -webkit-font-smoothing:antialiased;
    -webkit-user-select:none;user-select:none;
    font-size:15px;
    min-height:100vh;
  }
  input,textarea{-webkit-user-select:text;user-select:text}

  /* ===== HEADER ===== */
  #appHeader{
    position:sticky;top:0;z-index:30;
    background:rgba(255,255,255,.88);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:.5px solid var(--border);
    padding-top:var(--safe-top);
  }
  .header-inner{
    display:flex;align-items:center;gap:8px;
    padding:10px 12px;min-height:48px;
  }
  .header-inner h1{
    font-size:17px;font-weight:600;margin:0;flex:1;
    letter-spacing:-.01em;
  }
  .header-inner h1.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .icon-btn{
    background:none;border:none;font-size:20px;color:var(--primary);
    width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;font-family:inherit;
  }
  .icon-btn:active{background:rgba(10,132,255,.1)}
  .icon-btn.subtle{color:var(--text)}

  /* ===== MAIN ===== */
  #appMain{
    padding:14px 14px calc(var(--nav-h) + var(--safe-bottom) + 24px);
    max-width:640px;margin:0 auto;
  }

  /* ===== BOTTOM NAV ===== */
  #appNav{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:rgba(255,255,255,.92);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-top:.5px solid var(--border);
    height:calc(var(--nav-h) + var(--safe-bottom));
    padding-bottom:var(--safe-bottom);
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    align-items:center;
  }
  .nav-btn{
    background:none;border:none;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    color:var(--muted);font-size:10.5px;font-weight:500;
    cursor:pointer;padding:8px 4px;height:100%;
    justify-content:center;transition:.15s;
  }
  .nav-btn .ico{font-size:22px;line-height:1}
  .nav-btn.active{color:var(--primary)}
  .nav-btn:active{opacity:.6}
  .nav-spacer{position:relative}
  .fab{
    position:absolute;left:50%;top:0;transform:translate(-50%,-38%);
    width:56px;height:56px;border-radius:50%;
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#fff;border:none;font-size:28px;font-weight:300;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px rgba(10,132,255,.4);
    cursor:pointer;font-family:inherit;line-height:0;
    transition:transform .12s;
  }
  .fab:active{transform:translate(-50%,-38%) scale(.92)}

  /* ===== CARDS DE COMPRA ===== */
  .purchase-card{
    background:var(--card);border-radius:16px;padding:16px;
    margin-bottom:12px;cursor:pointer;
    box-shadow:0 1px 2px rgba(0,0,0,.05);
    transition:transform .1s;
    position:relative;overflow:hidden;
  }
  .purchase-card:active{transform:scale(.985)}
  .purchase-card.done::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ok);
  }
  .pc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
  .pc-name{font-size:16px;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.25}
  .pc-total{font-size:12px;color:var(--muted);margin-top:3px}
  .pc-badge{
    font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;
    background:var(--ok-bg);color:#0a8f3a;flex-shrink:0;
  }
  .bar{height:7px;background:#e9e9ee;border-radius:99px;overflow:hidden;margin-bottom:8px}
  .bar > span{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .4s ease}
  .bar.done > span{background:var(--ok)}
  .pc-line{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:3px}
  .pc-line strong{color:var(--text);font-weight:600}
  .pc-line .ok{color:#0a8f3a}
  .pc-line .warn{color:#b26a00}

  /* ===== DETALHE ===== */
  .summary-card{
    background:var(--card);border-radius:16px;padding:18px;margin-bottom:16px;
    box-shadow:0 1px 2px rgba(0,0,0,.05);
  }
  .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
  .sum-item .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
  .sum-item .val{font-size:18px;font-weight:700;margin-top:3px;letter-spacing:-.02em}
  .sum-item .val.ok{color:#0a8f3a}
  .sum-item .val.warn{color:#b26a00}

  .section-title{
    font-size:12px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--muted);font-weight:700;margin:20px 4px 10px;
    display:flex;justify-content:space-between;align-items:center;
  }
  .section-title button{
    background:none;border:none;color:var(--primary);font-size:12px;
    font-weight:600;font-family:inherit;cursor:pointer;padding:4px 6px;
  }

  .pay-list{
    background:var(--card);border-radius:16px;overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,.05);
  }
  .pay-item{
    padding:14px 16px;border-bottom:.5px solid var(--border);
    transition:background .1s;
  }
  .pay-item:last-child{border-bottom:none}
  .pay-item.paid{background:#fafefb}
  .pay-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .pay-num{font-size:13px;font-weight:600;color:var(--muted)}
  .pay-val{font-size:17px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
  .pay-meta{font-size:12.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
  .pay-meta strong{color:var(--text);font-weight:600}
  .pay-action{
    display:flex;gap:8px;margin-top:12px;align-items:stretch;
  }
  .pay-action input[type=date]{
    flex:1;font-size:16px;padding:10px 12px;border:1px solid var(--border);
    border-radius:10px;font-family:inherit;background:#fff;color:var(--text);
    -webkit-appearance:none;appearance:none;min-height:42px;
  }
  .btn{
    border:none;font-family:inherit;font-size:14px;font-weight:600;
    padding:11px 16px;border-radius:10px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    transition:opacity .12s;min-height:42px;
    background:#eef0f3;color:var(--text);
  }
  .btn:active{opacity:.7}
  .btn.primary{background:var(--primary);color:#fff}
  .btn.ok{background:var(--ok);color:#fff}
  .btn.danger{background:var(--danger-bg);color:var(--danger)}
  .btn.block{width:100%}
  .btn.sm{padding:8px 12px;font-size:13px;min-height:36px}
  .btn:disabled{opacity:.4;pointer-events:none}

  .tag{
    display:inline-block;padding:3px 9px;border-radius:99px;
    font-size:11px;font-weight:700;letter-spacing:.01em;
  }
  .tag.ok{background:var(--ok-bg);color:#0a8f3a}
  .tag.pend{background:var(--warn-bg);color:#b26a00}
  .tag.late{background:var(--danger-bg);color:var(--danger)}

  /* ===== EMPTY ===== */
  .empty{text-align:center;padding:80px 24px;color:var(--muted)}
  .empty .big{font-size:56px;margin-bottom:14px;line-height:1}
  .empty h3{margin:0 0 6px;color:var(--text);font-size:17px;font-weight:600}
  .empty p{margin:0;font-size:14px;line-height:1.5}

  /* ===== BOTTOM SHEET ===== */
  .backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;
    opacity:0;transition:opacity .25s;display:flex;align-items:flex-end;
  }
  .backdrop.open{opacity:1}
  .sheet{
    background:#fff;width:100%;max-width:640px;margin:0 auto;
    border-radius:20px 20px 0 0;
    padding:8px 20px calc(20px + var(--safe-bottom));
    transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);
    max-height:92vh;overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .backdrop.open .sheet{transform:translateY(0)}
  .grabber{
    width:38px;height:5px;background:#d1d1d6;border-radius:99px;
    margin:6px auto 16px;
  }
  .sheet h2{font-size:20px;font-weight:700;margin:0 0 20px;letter-spacing:-.02em}
  .field{margin-bottom:16px}
  .field label{
    display:block;font-size:12.5px;font-weight:600;color:var(--muted);
    margin-bottom:6px;letter-spacing:.01em;
  }
  .field input{
    width:100%;font-size:16px;padding:12px 14px;
    border:1px solid var(--border);border-radius:11px;
    font-family:inherit;background:#f9f9fb;color:var(--text);
    -webkit-appearance:none;appearance:none;
  }
  .field input:focus{outline:none;border-color:var(--primary);background:#fff;
    box-shadow:0 0 0 3px rgba(10,132,255,.15)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .preview{
    background:#f2f2f7;border-radius:11px;padding:12px 14px;
    font-size:13px;color:var(--muted);line-height:1.55;margin-top:4px;
  }
  .preview strong{color:var(--text);font-weight:600}
  .sheet-actions{display:flex;gap:10px;margin-top:8px}
  .sheet-actions .btn{flex:1}

  /* ===== RELATÓRIO ===== */
  .month-picker{
    background:var(--card);border-radius:14px;padding:6px;
    box-shadow:0 1px 2px rgba(0,0,0,.05);margin-bottom:16px;
    display:flex;
  }
  .month-picker input{
    width:100%;border:none;background:transparent;font-size:16px;
    padding:12px 14px;font-family:inherit;color:var(--text);
    -webkit-appearance:none;appearance:none;text-align:center;font-weight:600;
  }
  .month-picker input:focus{outline:none}

  .report-totals{
    background:var(--card);border-radius:16px;padding:16px 18px;
    box-shadow:0 1px 2px rgba(0,0,0,.05);margin-bottom:16px;
  }
  .report-totals .line{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:6px 0;font-size:14px;
  }
  .report-totals .line + .line{border-top:.5px solid var(--border)}
  .report-totals .line strong{font-size:17px;font-weight:700;letter-spacing:-.02em}

  .report-list{
    background:var(--card);border-radius:16px;overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,.05);margin-bottom:20px;
  }
  .report-row{
    padding:13px 16px;border-bottom:.5px solid var(--border);
    display:flex;justify-content:space-between;gap:10px;align-items:center;
  }
  .report-row:last-child{border-bottom:none}
  .report-row .rname{font-weight:600;font-size:14px;line-height:1.3}
  .report-row .rmeta{font-size:12px;color:var(--muted);margin-top:2px}
  .report-row .rval{font-weight:700;font-size:14.5px;white-space:nowrap;text-align:right}
  .report-row .rval.ok{color:#0a8f3a}

  .report-empty{
    text-align:center;color:var(--muted);font-size:13px;padding:24px 16px;
  }

  .quitação-banner{
    background:linear-gradient(135deg,#34c759,#28a745);
    color:#fff;border-radius:16px;padding:20px;text-align:center;
    margin-bottom:16px;box-shadow:0 4px 14px rgba(52,199,89,.3);
  }
  .quitação-banner .big{font-size:36px;line-height:1;margin-bottom:6px}
  .quitação-banner h3{margin:0;font-size:17px;font-weight:700}
  .quitação-banner p{margin:6px 0 0;font-size:13px;opacity:.95}

  /* ===== PRINT ===== */
  @media print{
    body{background:#fff;font-size:12px}
    #appHeader, #appNav, .no-print, .backdrop, .fab{display:none !important}
    #appMain{padding:0;max-width:none}
    .report-totals, .report-list, .summary-card, .quitação-banner{
      box-shadow:none;border:1px solid #ddd;
    }
    .purchase-card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
    .pay-item{break-inside:avoid}
    @page{margin:14mm}
  }

  /* Scroll natural e sem bounce estranho */
  #appMain{-webkit-overflow-scrolling:touch}
</style>
</head>
<body>

<header id="appHeader"></header>
<main id="appMain"></main>
<nav id="appNav"></nav>
<div id="sheetRoot"></div>

<script>
/* ============================= HELPERS ============================= */
const STORAGE_KEY = 'compras_parceladas_v2';
const uid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2));

const fmtBRL = v => (v || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});

function toISO(d){
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}
const todayISO = () => toISO(new Date());

function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function fmtDateShort(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}`;
}

function addMonths(iso, n){
  const [y,m,d] = iso.split('-').map(Number);
  const base = new Date(y, m - 1 + n, 1);
  const lastDay = new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate();
  base.setDate(Math.min(d, lastDay));
  return toISO(base);
}
function monthLabel(ym){
  const [y,m] = ym.split('-').map(Number);
  const s = new Date(y, m-1, 1).toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================= ESTADO ============================= */
const state = {
  purchases: [],
  view: 'home',       // home | detail | report | purchaseReport
  currentId: null,
  reportMonth: todayISO().slice(0,7)
};

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) state.purchases = JSON.parse(raw);
  }catch(e){ console.error('Erro ao carregar', e); }
}
function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.purchases));
}

/* ============================= AÇÕES ============================= */
function createPurchase(name, total, count, firstDue){
  const totalCents = Math.round(total * 100);
  const base = Math.floor(totalCents / count);
  const remainder = totalCents - base * count;
  const payments = [];
  for(let i = 0; i < count; i++){
    const cents = base + (i < remainder ? 1 : 0);
    payments.push({
      number: i + 1,
      value: cents / 100,
      dueDate: addMonths(firstDue, i),
      paidDate: null
    });
  }
  const p = {
    id: uid(),
    name: name.trim(),
    total: totalCents / 100,
    firstDue,
    createdAt: new Date().toISOString(),
    payments
  };
  state.purchases.unshift(p);
  save();
  return p;
}

const getPurchase = id => state.purchases.find(p => p.id === id);

function markPaid(id, index, dateStr){
  const p = getPurchase(id); if(!p) return;
  p.payments[index].paidDate = dateStr || todayISO();
  save(); render();
}
function unmarkPaid(id, index){
  const p = getPurchase(id); if(!p) return;
  p.payments[index].paidDate = null;
  save(); render();
}
function changePaidDate(id, index, dateStr){
  const p = getPurchase(id); if(!p) return;
  p.payments[index].paidDate = dateStr || null;
  save(); render();
}
function deletePurchase(id){
  const p = getPurchase(id);
  if(!confirm(`Excluir "${p.name}"? Não pode ser desfeito.`)) return;
  state.purchases = state.purchases.filter(x => x.id !== id);
  save(); goHome();
}
function payAllOverdue(id){
  const p = getPurchase(id);
  const today = todayISO();
  p.payments.forEach(pay => {
    if(!pay.paidDate && pay.dueDate <= today) pay.paidDate = pay.dueDate;
  });
  save(); render();
}

/* ============================= NAVEGAÇÃO ============================= */
function goHome(){ state.view='home'; state.currentId=null; render(); window.scrollTo(0,0); }
function openDetail(id){ state.view='detail'; state.currentId=id; render(); window.scrollTo(0,0); }
function openReport(){ state.view='report'; state.currentId=null; render(); window.scrollTo(0,0); }
function openPurchaseReport(id){ state.view='purchaseReport'; state.currentId=id; render(); window.scrollTo(0,0); }

/* ============================= PROGRESSO ============================= */
function progressOf(p){
  const paid = p.payments.filter(x => x.paidDate);
  const paidValue = paid.reduce((s,x) => s + x.value, 0);
  return {
    paidCount: paid.length,
    total: p.payments.length,
    paidValue,
    remaining: p.total - paidValue,
    pct: Math.round(paid.length / p.payments.length * 100),
    done: paid.length === p.payments.length
  };
}

/* ============================= RENDER ============================= */
function render(){
  renderHeader();
  renderMain();
  renderNav();
}

function renderHeader(){
  const h = document.getElementById('appHeader');
  let html = '';

  if(state.view === 'home'){
    html = `<div class="header-inner"><h1>Minhas Compras</h1></div>`;
  }
  else if(state.view === 'detail'){
    const p = getPurchase(state.currentId);
    if(!p){ goHome(); return; }
    html = `<div class="header-inner">
      <button class="icon-btn" onclick="goHome()">‹</button>
      <h1 class="ellipsis">${escapeHtml(p.name)}</h1>
    </div>`;
  }
  else if(state.view === 'report'){
    html = `<div class="header-inner">
      <button class="icon-btn" onclick="goHome()">‹</button>
      <h1>Relatório Mensal</h1>
    </div>`;
  }
  else if(state.view === 'purchaseReport'){
    const p = getPurchase(state.currentId);
    if(!p){ goHome(); return; }
    html = `<div class="header-inner">
      <button class="icon-btn" onclick="openDetail('${p.id}')">‹</button>
      <h1 class="ellipsis">Relatório</h1>
      <button class="icon-btn" onclick="window.print()">↗</button>
    </div>`;
  }
  h.innerHTML = html;
}

function renderMain(){
  const m = document.getElementById('appMain');
  if(state.view === 'home') m.innerHTML = viewHome();
  else if(state.view === 'detail') m.innerHTML = viewDetail();
  else if(state.view === 'report') m.innerHTML = viewReport();
  else if(state.view === 'purchaseReport') m.innerHTML = viewPurchaseReport();
  m.scrollTop = 0;
}

function renderNav(){
  const n = document.getElementById('appNav');
  const isHome = state.view === 'home';
  const isReport = state.view === 'report';
  n.innerHTML = `
    <button class="nav-btn ${isHome?'active':''}" onclick="goHome()">
      <span class="ico">🏠</span><span>Início</span>
    </button>
    <div class="nav-spacer">
      <button class="fab" onclick="openNewSheet()" aria-label="Novo Bem">+</button>
    </div>
    <button class="nav-btn ${isReport?'active':''}" onclick="openReport()">
      <span class="ico">📊</span><span>Relatório</span>
    </button>
  `;
}

/* ============================= VIEW: HOME ============================= */
function viewHome(){
  let html = '';
  if(state.purchases.length === 0){
    html = `<div class="empty">
      <div class="big">📦</div>
      <h3>Nenhum bem cadastrado</h3>
      <p>Toque no botão <strong>+</strong> abaixo para começar o acompanhamento das suas compras parceladas.</p>
    </div>`;
  } else {
    html = state.purchases.map(purchaseCard).join('');
  }
  html += backupSection();
  return html;
}

function backupSection(){
  return `
    <div class="section-title">Backup</div>
    <div class="summary-card" style="padding:14px">
      <p style="font-size:12.5px;color:var(--muted);margin:0 0 12px;line-height:1.5">
        Se você limpar os dados do site no navegador, tudo se perde.
        Exporte um arquivo de backup regularmente para não perder nada.
      </p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn sm primary" style="flex:1" onclick="exportarDados()">
          ⬇️ Exportar backup
        </button>
        <button class="btn sm" style="flex:1" onclick="document.getElementById('inputImport').click()">
          ⬆️ Importar backup
        </button>
      </div>
      <input type="file" id="inputImport" accept=".json"
             style="display:none" onchange="importarDados(event)">
    </div>
  `;
}

function purchaseCard(p){
  const s = progressOf(p);
  return `<div class="purchase-card ${s.done?'done':''}" onclick="openDetail('${p.id}')">
    <div class="pc-head">
      <div style="min-width:0;flex:1">
        <h3 class="pc-name">${escapeHtml(p.name)}</h3>
        <div class="pc-total">${s.total}x • Total ${fmtBRL(p.total)}</div>
      </div>
      ${s.done ? '<span class="pc-badge">QUITADO</span>' : ''}
    </div>
    <div class="bar ${s.done?'done':''}"><span style="width:${s.pct}%"></span></div>
    <div class="pc-line"><span>${s.paidCount} de ${s.total} pagas</span><span>${s.pct}%</span></div>
    <div class="pc-line">
      <span>Pago: <strong>${fmtBRL(s.paidValue)}</strong></span>
      <span>Falta: <strong class="${s.remaining>0?'warn':'ok'}">${fmtBRL(s.remaining)}</strong></span>
    </div>
  </div>`;
}

/* ============================= VIEW: DETAIL ============================= */
function viewDetail(){
  const p = getPurchase(state.currentId);
  if(!p) return '';
  const s = progressOf(p);
  const today = todayISO();

  const overdueCount = p.payments.filter(x => !x.paidDate && x.dueDate < today).length;

  const items = p.payments.map((pay, i) => {
    const late = !pay.paidDate && pay.dueDate < today;
    const tag = pay.paidDate
      ? '<span class="tag ok">Pago</span>'
      : (late ? '<span class="tag late">Atrasada</span>' : '<span class="tag pend">Pendente</span>');

    let action = '';
    if(pay.paidDate){
      action = `<div class="pay-action">
        <input type="date" value="${pay.paidDate}"
          onchange="changePaidDate('${p.id}',${i},this.value)">
        <button class="btn danger sm" onclick="unmarkPaid('${p.id}',${i})">Desfazer</button>
      </div>`;
    } else {
      action = `<div class="pay-action">
        <input type="date" id="pd-${i}" value="${today}">
        <button class="btn primary sm" onclick="markPaid('${p.id}',${i},document.getElementById('pd-${i}').value)">Registrar</button>
      </div>`;
    }

    return `<div class="pay-item ${pay.paidDate?'paid':''}">
      <div class="pay-head">
        <span class="pay-num">Parcela ${pay.number}</span>
        ${tag}
      </div>
      <div class="pay-val">${fmtBRL(pay.value)}</div>
      <div class="pay-meta">
        <span>Venc. <strong>${fmtDate(pay.dueDate)}</strong></span>
        ${pay.paidDate ? `<span>Pago em <strong>${fmtDate(pay.paidDate)}</strong></span>` : ''}
      </div>
      ${action}
    </div>`;
  }).join('');

  const bulkBtn = overdueCount > 1
    ? `<button class="btn sm block" style="margin-bottom:14px" onclick="payAllOverdue('${p.id}')">
         ✓ Pagar todas as ${overdueCount} vencidas
       </button>`
    : '';

  return `
    <div class="summary-card">
      <div class="summary-grid">
        <div class="sum-item"><div class="lbl">Valor total</div><div class="val">${fmtBRL(p.total)}</div></div>
        <div class="sum-item"><div class="lbl">Parcelas</div><div class="val">${s.paidCount}/${s.total}</div></div>
        <div class="sum-item"><div class="lbl">Total pago</div><div class="val ok">${fmtBRL(s.paidValue)}</div></div>
        <div class="sum-item"><div class="lbl">Saldo devedor</div><div class="val ${s.remaining>0?'warn':'ok'}">${fmtBRL(s.remaining)}</div></div>
      </div>
      <div class="bar ${s.done?'done':''}" style="margin-top:16px"><span style="width:${s.pct}%"></span></div>
      <div class="pc-line"><span>${s.pct}% concluído</span><span>${fmtDate(p.payments[0].dueDate)} → ${fmtDate(p.payments[p.payments.length-1].dueDate)}</span></div>
    </div>

    ${bulkBtn}

    <div style="display:flex;gap:10px;margin-bottom:16px">
      <button class="btn sm" style="flex:1" onclick="openPurchaseReport('${p.id}')">
        📄 ${s.done ? 'Relatório de Quitação' : 'Relatório do Bem'}
      </button>
      <button class="btn sm danger" onclick="deletePurchase('${p.id}')">Excluir</button>
    </div>

    <div class="section-title">Parcelas <span>${s.paidCount}/${s.total} pagas</span></div>
    <div class="pay-list">${items}</div>
  `;
}

/* ============================= VIEW: REPORT ============================= */
function viewReport(){
  const month = state.reportMonth;
  const paid = [];
  const pending = [];
  let totalPaid = 0, totalPend = 0;

  state.purchases.forEach(p => {
    p.payments.forEach(pay => {
      if(pay.paidDate && pay.paidDate.slice(0,7) === month){
        paid.push({p, pay});
        totalPaid += pay.value;
      }
      if(!pay.paidDate && pay.dueDate.slice(0,7) === month){
        pending.push({p, pay});
        totalPend += pay.value;
      }
    });
  });

  const paidHTML = paid.length
    ? paid.map(({p, pay}) => `
        <div class="report-row">
          <div style="min-width:0">
            <div class="rname">${escapeHtml(p.name)}</div>
            <div class="rmeta">Parcela ${pay.number} • Venc. ${fmtDate(pay.dueDate)} • Pago em ${fmtDate(pay.paidDate)}</div>
          </div>
          <div class="rval ok">${fmtBRL(pay.value)}</div>
        </div>`).join('')
    : `<div class="report-empty">Nenhuma parcela paga neste mês.</div>`;

  const pendHTML = pending.length
    ? pending.map(({p, pay}) => `
        <div class="report-row">
          <div style="min-width:0">
            <div class="rname">${escapeHtml(p.name)}</div>
            <div class="rmeta">Parcela ${pay.number} • Venc. ${fmtDate(pay.dueDate)}</div>
          </div>
          <div class="rval">${fmtBRL(pay.value)}</div>
        </div>`).join('')
    : `<div class="report-empty">Nenhuma parcela em aberto neste mês.</div>`;

  return `
    <div class="month-picker no-print">
      <input type="month" value="${month}" onchange="state.reportMonth=this.value;render()">
    </div>

    <div class="report-totals">
      <div class="line"><span>Total pago no mês</span><strong style="color:#0a8f3a">${fmtBRL(totalPaid)}</strong></div>
      <div class="line"><span>Total em aberto no mês</span><strong style="color:#b26a00">${fmtBRL(totalPend)}</strong></div>
    </div>

    <div class="section-title no-print">Parcelas pagas <span>${paid.length}</span></div>
    <div class="report-list">${paidHTML}</div>

    <div class="section-title no-print">Parcelas em aberto <span>${pending.length}</span></div>
    <div class="report-list">${pendHTML}</div>

    <button class="btn block no-print" onclick="window.print()" style="margin-top:8px">
      ↗ Compartilhar / Salvar PDF
    </button>
  `;
}

/* ============================= VIEW: PURCHASE REPORT ============================= */
function viewPurchaseReport(){
  const p = getPurchase(state.currentId);
  if(!p) return '';
  const s = progressOf(p);

  const rows = p.payments.map(pay => `
    <div class="pay-item ${pay.paidDate?'paid':''}">
      <div class="pay-head">
        <span class="pay-num">Parcela ${pay.number}</span>
        ${pay.paidDate
          ? '<span class="tag ok">Pago</span>'
          : '<span class="tag pend">Pendente</span>'}
      </div>
      <div class="pay-val">${fmtBRL(pay.value)}</div>
      <div class="pay-meta">
        <span>Vencimento <strong>${fmtDate(pay.dueDate)}</strong></span>
        ${pay.paidDate ? `<span>Pagamento <strong>${fmtDate(pay.paidDate)}</strong></span>` : ''}
      </div>
    </div>`).join('');

  return `
    ${s.done ? `
      <div class="quitação-banner">
        <div class="big">✓</div>
        <h3>Bem Quitado</h3>
        <p>Todas as ${s.total} parcelas foram pagas</p>
      </div>` : ''}

    <div class="summary-card">
      <div class="sum-item" style="margin-bottom:14px">
        <div class="lbl">Bem</div>
        <div class="val" style="font-size:20px">${escapeHtml(p.name)}</div>
      </div>
      <div class="summary-grid">
        <div class="sum-item"><div class="lbl">Valor total</div><div class="val">${fmtBRL(p.total)}</div></div>
        <div class="sum-item"><div class="lbl">Parcelas</div><div class="val">${s.total}x</div></div>
        <div class="sum-item"><div class="lbl">Total pago</div><div class="val ok">${fmtBRL(s.paidValue)}</div></div>
        <div class="sum-item"><div class="lbl">Saldo</div><div class="val ${s.remaining>0?'warn':'ok'}">${fmtBRL(s.remaining)}</div></div>
      </div>
      <div class="pc-line" style="margin-top:14px">
        <span>1º venc. <strong>${fmtDate(p.payments[0].dueDate)}</strong></span>
        <span>Últ. venc. <strong>${fmtDate(p.payments[p.payments.length-1].dueDate)}</strong></span>
      </div>
    </div>

    <div class="section-title">Detalhamento das parcelas</div>
    <div class="pay-list">${rows}</div>

    <button class="btn block no-print" onclick="window.print()" style="margin-top:20px">
      ↗ Compartilhar / Salvar PDF
    </button>
  `;
}

/* ============================= BOTTOM SHEET ============================= */
function openNewSheet(){
  const root = document.getElementById('sheetRoot');
  root.innerHTML = `
    <div class="backdrop" id="sheetBackdrop" onclick="if(event.target===this)closeSheet()">
      <div class="sheet" onclick="event.stopPropagation()">
        <div class="grabber"></div>
        <h2>Novo Bem</h2>

        <div class="field">
          <label>Nome do bem</label>
          <input type="text" id="npName" placeholder="Ex.: Notebook, Geladeira, Carro…"
                 autocomplete="off" enterkeyhint="next">
        </div>

        <div class="field">
          <label>Valor total (R$)</label>
          <input type="number" id="npTotal" inputmode="decimal" step="0.01" min="0.01"
                 placeholder="0,00" enterkeyhint="next">
        </div>

        <div class="row2">
          <div class="field">
            <label>Nº de parcelas</label>
            <input type="number" id="npCount" inputmode="numeric" min="1" step="1" value="12">
          </div>
          <div class="field">
            <label>1º vencimento</label>
            <input type="date" id="npFirst" value="${todayISO()}">
          </div>
        </div>

        <div class="preview" id="npPreview">Preencha o valor e o nº de parcelas.</div>

        <div class="sheet-actions">
          <button class="btn" onclick="closeSheet()">Cancelar</button>
          <button class="btn primary" onclick="submitNewPurchase()">Criar</button>
        </div>
      </div>
    </div>`;

  // Força reflow para animar
  requestAnimationFrame(() => {
    document.getElementById('sheetBackdrop').classList.add('open');
  });

  ['npTotal','npCount','npFirst'].forEach(id =>
    document.getElementById(id).addEventListener('input', updatePreview));
  document.getElementById('npName').focus();
  updatePreview();
}

function updatePreview(){
  const total = parseFloat(document.getElementById('npTotal').value);
  const count = parseInt(document.getElementById('npCount').value, 10);
  const first = document.getElementById('npFirst').value;
  const box = document.getElementById('npPreview');
  if(!total || !count || count < 1 || !first){
    box.textContent = 'Preencha o valor e o nº de parcelas.';
    return;
  }
  const last = addMonths(first, count - 1);
  const approx = total / count;
  box.innerHTML = `<strong>${count}x</strong> de aproximadamente <strong>${fmtBRL(approx)}</strong><br>
    1ª: ${fmtDate(first)} • Última: ${fmtDate(last)}`;
}

function submitNewPurchase(){
  const name = document.getElementById('npName').value.trim();
  const total = parseFloat(document.getElementById('npTotal').value);
  const count = parseInt(document.getElementById('npCount').value, 10);
  const first = document.getElementById('npFirst').value;

  if(!name){ alert('Informe o nome do bem.'); return; }
  if(!total || total <= 0){ alert('Informe um valor total válido.'); return; }
  if(!count || count < 1){ alert('Informe um número de parcelas válido.'); return; }
  if(!first){ alert('Informe a data do primeiro vencimento.'); return; }

  const p = createPurchase(name, total, count, first);
  closeSheet();
  openDetail(p.id);
}

function closeSheet(){
  const bd = document.getElementById('sheetBackdrop');
  if(!bd) return;
  bd.classList.remove('open');
  setTimeout(() => { document.getElementById('sheetRoot').innerHTML = ''; }, 300);
}
/* ============================= BACKUP ============================= */
function exportarDados(){
  const dados = {
    versao: 2,
    exportadoEm: new Date().toISOString(),
    compras: state.purchases
  };

  const blob = new Blob([JSON.stringify(dados, null, 2)], {
    type: 'application/json'
  });
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url;
  a.download = `backup-compras-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importarDados(event){
  const arquivo = event.target.files[0];
  if(!arquivo) return;

  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const dados = JSON.parse(ev.target.result);

      // Aceita tanto { compras: [...] } quanto o array direto
      const lista = Array.isArray(dados) ? dados : dados.compras;
      if(!Array.isArray(lista)){
        alert('Arquivo inválido: não encontrei a lista de compras.');
        return;
      }

      if(!confirm(`Importar ${lista.length} compra(s)? Isso substituirá seus dados atuais.`)){
        return;
      }

      state.purchases = lista;
      save();
      alert('Backup restaurado com sucesso!');
      goHome();
    }catch(err){
      alert('Erro ao ler o arquivo: ' + err.message);
    }
  };
  reader.readAsText(arquivo);

  // Permite importar o mesmo arquivo de novo depois
  event.target.value = '';
}
/* ============================= INIT ============================= */
load();
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });
render();

/* ---- Service Worker para PWA ---- */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
